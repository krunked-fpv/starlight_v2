<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <meta
      name="description"
      content="Pokémon: Starlight Island — Complete 1,025 Gen 1–9 HD-2D Pixel-Art Edition"
    />
    <title>Pokémon: Starlight Island — HD-2D Pixel Edition</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/starlight-emblem.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050712}
      #starlight-root,#stage-shell,#starlight-canvas,#ui-layer{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}

    <div id="starlight-root" data-app-version="3.0.0">
      <div id="stage-shell" class="stage-shell">
        <canvas id="starlight-canvas" aria-label="Starlight Island Game Canvas"></canvas>
        <div id="crt-overlay" class="crt-overlay" aria-hidden="true"></div>
      </div>
      <div id="ui-layer" class="ui-layer"></div>
      <div id="svg-sprite-host" class="sr-only" aria-hidden="true"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
