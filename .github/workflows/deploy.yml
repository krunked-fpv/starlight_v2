name: Deploy Starlight v2 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake procedural atlases and vector icons
        run: npm run bake

      - name: Verify byte-identical second bake
        run: |
          find public/atlases public/icons -type f | sort | xargs sha256sum > /tmp/bake1.sha256
          npm run bake
          find public/atlases public/icons -type f | sort | xargs sha256sum > /tmp/bake2.sha256
          diff -u /tmp/bake1.sha256 /tmp/bake2.sha256

      - name: Build production static bundle
        run: npm run build

      - name: Verify dist footprint under 25 MB
        run: |
          BYTES=$(du -sb dist | awk '{print $1}')
          echo "dist/ size: ${BYTES} bytes"
          test "${BYTES}" -lt 26214400

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E with Canvas2D / SwiftShader
        env:
          CI: 'true'
          STARLIGHT_RENDERER: canvas2d
        run: npx playwright test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
